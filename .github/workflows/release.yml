# Builds Windows and macOS installers when a version tag (e.g. v1.0.1) is pushed,
# then publishes them as a release in the public releases repo, where the app
# checks for updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASES_REPO: cahyadikrishna/kayana-photo-helper-releases

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run build

      - name: Package
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certificate yet; don't let electron-builder look for one
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$RELEASES_REPO" \
            --title "Kayana Photo Helper $GITHUB_REF_NAME" \
            --notes "Windows: download the \`.exe\` file. macOS: download the \`.dmg\` file."
